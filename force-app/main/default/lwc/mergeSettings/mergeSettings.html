<template>
    <lightning-card title="Merge Control Settings" icon-name="standard:task">
        <div slot="footer">
            <template if:true={hasChanges}>
                <lightning-button variant="brand" label="Save Settings" onclick={handleSave}></lightning-button>
            </template>
        </div>
        <div class="slds-m-around_medium">
            <template if:true={settings}>
                <lightning-tabset variant="vertical">
                    <lightning-tab label="Trigger Configuration">
                        <h2 class="slds-text-title_caps">Trigger Configuration</h2>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="4">
                                <lightning-input type="toggle" label="Account Trigger Disabled" name="accountDisabled" checked={isAccountTriggerDisabled} onchange={handleAccountTriggerChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="4">
                                <lightning-input type="toggle" label="Contact Trigger Disabled" name="contactDisabled" checked={isContactTriggerDisabled} onclick={handleContactTriggerChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="6">
                                <lightning-input type="text" label="Automatically merge orphaned households" name="autoMergeOrphanedHouseholds" max-length="255" field-level-help="Merge Accounts for related Contacts when Account becomes empty after merge for the following record types (comma delimited list)" value={autoMergeOrphanedHouseholds} onchange={handleAutoMergeOrphanedHouseholdsChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="6">
                                <lightning-input type="toggle" label="Disable NPSP triggers on orphaned household merge" name="disableNpspTriggersOnOrphanMerge" field-level-help="Disable NPSP (TDTM) triggers for the rest of the transaction before merging orphaned households, so NPSP address sync does not overwrite the kept contact's address. No effect when NPSP is not installed." checked={disableNpspTriggersOnOrphanMerge} onchange={handleDisableNpspTriggersOnOrphanMergeChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="6">
                                <lightning-input type="toggle" label="Reset default address on orphaned household merge" name="resetDefaultAddressOnOrphanMerge" field-level-help="After an orphaned household is merged with NPSP triggers disabled, make the kept contact's mailing address the household's single default NPSP Address. Single-member households only; skipped when the contact has an address override or the household has seasonal addresses. Requires 'Disable NPSP triggers on orphaned household merge'. No effect when NPSP is not installed." checked={resetDefaultAddressOnOrphanMerge} onchange={handleResetDefaultAddressOnOrphanMergeChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="6">
                                <lightning-input type="toggle" label="Merge households with members" name="mergeHouseholdsWithMembers" field-level-help="After a Contact merge, also merge the merged contact's household into the kept contact's household when other contacts remain in it (both record types must be listed above). The remaining members, their records and the household's donations move to the kept household. Logged as an Account merge candidate with rule 'Household Member Merge'." checked={mergeHouseholdsWithMembers} onchange={handleMergeHouseholdsWithMembersChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="6">
                                <lightning-input type="toggle" label="Merge households with members: require same address" name="mergeHouseholdsRequireSameAddress" field-level-help="Merge a household that still has members only when every remaining member's mailing street (first line) and five-digit postal code match the kept contact's mailing address after the merge. Case, punctuation and ZIP+4 are ignored; a kept contact without a mailing street never matches." checked={mergeHouseholdsRequireSameAddress} onchange={handleMergeHouseholdsRequireSameAddressChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="3">
                                <lightning-input type="number" label="Merge households with members: max other members" name="mergeHouseholdsMaxOtherMembers" min="0" max="999" step="1" field-level-help="The most contacts the merged contact's household may still have and be merged (for example 1 = a spouse only). Leave blank for no limit." value={mergeHouseholdsMaxOtherMembers} onchange={handleMergeHouseholdsMaxOtherMembersChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="6">
                                <lightning-input type="toggle" label="Household merge uses the Account keep record rules" name="householdMergeUsesKeepRules" field-level-help="When a household is merged after a Contact merge (orphaned household or household with members), choose the surviving household with the Account keep record rules instead of always keeping the kept contact's household. The kept contact moves into the surviving household when the rules prefer the other one. Falls back to the kept contact's household when the rules do not decide." checked={householdMergeUsesKeepRules} onchange={handleHouseholdMergeUsesKeepRulesChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-tab>
                    <lightning-tab label="User Configuration">
                        <h2 class="slds-text-title_caps">User Configuration</h2>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="6">
                                <template if:true={_users}>
                                    <lightning-datatable
                                        key-field="id"
                                        data={_users}
                                        columns={userCols}
                                        onrowaction={handleUserAction}
                                        hide-checkbox-column
                                    ></lightning-datatable>
                                </template>
                            </lightning-layout-item>
                        </lightning-layout>

                    </lightning-tab>
                    <lightning-tab label="Profile Configuration">
                        <h2 class="slds-text-title_caps">Profile Configuration</h2>
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="6">
                                <template if:true={_profiles}>
                                    <lightning-datatable
                                        key-field="id"
                                        data={_profiles}
                                        columns={profileCols}
                                        hide-checkbox-column
                                        onrowaction={handleProfileAction}
                                    ></lightning-datatable>
                                </template>
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-tab>
                </lightning-tabset>
            </template>
            </div>
    </lightning-card>
</template>
