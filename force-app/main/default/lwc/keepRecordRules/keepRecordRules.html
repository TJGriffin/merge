<template>
    <lightning-card title="Keep Record Rules" icon-name="standard:record">
        <div class="slds-m-horizontal_medium">
            <p class="slds-m-bottom_small slds-text-color_weak">
                Which record survives a merge. Rules are applied in order: each one narrows the duplicate group
                to the records it prefers, and the first rule that leaves a single record chooses it. A rule that
                no record satisfies is skipped. When no rule singles out a record, the record with the lowest Id is kept.
                Example: 1. Relationship Manager has a value, 2. Created Date is the oldest.
            </p>

            <lightning-combobox
                label="Object"
                value={objectType}
                options={objectOptions}
                onchange={handleObjectChange}>
            </lightning-combobox>

            <template if:true={hasObject}>
                <template if:true={loading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                <template if:false={hasRules}>
                    <p class="slds-m-vertical_small slds-text-color_weak">No rules yet: the record with the lowest Id is kept.</p>
                </template>

                <template for:each={rules} for:item="rule">
                    <div key={rule.uiKey} class="slds-box slds-box_small slds-m-vertical_x-small">
                        <div class="slds-grid slds-gutters slds-grid_vertical-align-end slds-wrap">
                            <div class="slds-col slds-size_1-of-12 slds-text-heading_small slds-p-bottom_x-small">
                                {rule.position}.
                            </div>
                            <div class="slds-col slds-size_4-of-12">
                                <c-merge-field-selector
                                    label="Prefer the record whose field"
                                    value={rule.fieldName}
                                    options={fieldOptions}
                                    data-index={rule.index}
                                    onchange={handleFieldChange}>
                                </c-merge-field-selector>
                            </div>
                            <div class="slds-col slds-size_3-of-12">
                                <lightning-combobox
                                    label="Preference"
                                    value={rule.preference}
                                    options={preferenceOptions}
                                    data-index={rule.index}
                                    onchange={handlePreferenceChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_2-of-12">
                                <template if:true={rule.needsValue}>
                                    <lightning-input
                                        label="Value"
                                        value={rule.value}
                                        data-index={rule.index}
                                        onchange={handleValueChange}>
                                    </lightning-input>
                                </template>
                            </div>
                            <div class="slds-col slds-size_2-of-12 slds-p-bottom_xx-small slds-text-align_right">
                                <lightning-button-icon
                                    icon-name="utility:up"
                                    alternative-text="Move up"
                                    title="Move up"
                                    disabled={rule.isFirst}
                                    data-index={rule.index}
                                    onclick={moveUp}>
                                </lightning-button-icon>
                                <lightning-button-icon
                                    icon-name="utility:down"
                                    alternative-text="Move down"
                                    title="Move down"
                                    disabled={rule.isLast}
                                    data-index={rule.index}
                                    onclick={moveDown}>
                                </lightning-button-icon>
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    alternative-text="Remove rule"
                                    title="Remove rule"
                                    data-index={rule.index}
                                    onclick={removeRule}>
                                </lightning-button-icon>
                            </div>
                        </div>
                    </div>
                </template>

                <div class="slds-grid slds-gutters slds-m-vertical_small">
                    <lightning-button label="Add Rule" icon-name="utility:add" onclick={addRule} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={handleSave} disabled={saveDisabled}></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
